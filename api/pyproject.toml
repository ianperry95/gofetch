[project]
name = "gofetch-api"
version = "0.1.0"
description = "GoFetch - AI-powered news reader middleware"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "apscheduler>=3.11",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "huggingface-hub>=0.27",
    "openai>=1.60",
    "scikit-learn>=1.6",
    "numpy>=2.0",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
